<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mohamed Lakhdar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts for a cleaner typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    /* Reset and base styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f0f14 0%, #1a1a2e 100%);
        color: #eaeaf0;
        overflow: hidden;
    }

    /* Main container */
    .container {
        max-width: 700px;
        padding: 40px;
        text-align: center;
        background: rgba(15, 15, 20, 0.75);
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        animation: fadeIn 1.5s ease forwards;
        opacity: 0;
    }

    h1 {
        font-size: 3rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    p {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #c0c0d0;
    }

    .tagline {
        margin-top: 25px;
        font-size: 0.95rem;
        color: #8f8fa3;
        font-style: italic;
        transition: color 0.3s;
    }

    .tagline:hover {
        color: #ffffff;
    }

    /* Buttons for GitHub / Portfolio */
    .links {
        margin-top: 30px;
    }

    .links a {
        text-decoration: none;
        color: #ffffff;
        border: 1px solid #ffffff;
        padding: 10px 20px;
        border-radius: 8px;
        margin: 0 10px;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .links a:hover {
        background: #ffffff;
        color: #0f0f14;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Mohamed Lakhdar</h1>

    <p>
        Student at 1337.<br>
        Building, learning, and documenting along the way.
    </p>

    <div class="tagline">
        Projects and writing coming soon.
    </div>

    <div class="links">
        <a href="https://github.com/thebeaarr" target="_blank">GitHub</a>
        <a href="https://linkedin.com/" target="_blank">LinkedIn</a>
    </div>
</div>

</body>
</html>
